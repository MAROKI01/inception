services:

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile

    container_name: nginx

    env_file:
      - .env

    depends_on:
      - wordpress

    ports:
      - "443:443"

    volumes:
      - wordpress_data:/var/www/html:ro

    networks:
      - inception

    restart: always

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile

    container_name: mariadb

    env_file:
      - .env

    secrets:
      - db_password
      - db_root_password

    volumes:
      - mariadb_data:/var/lib/mysql

    networks: 
      - inception

    restart: always
  
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile

    container_name: wordpress

    env_file:
      - .env
    
    secrets:
      - db_password
      - credentials

    environment:
      MYSQL_HOST: mariadb

    volumes:
      - wordpress_data:/var/www/html

    depends_on:
      - mariadb

    networks:
      - inception

    restart: always

volumes:
   mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ntahadou/data/mariadb
   
   wordpress_data:
     driver: local
     driver_opts:
       type: none
       o: bind
       device: /home/ntahadou/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  credentials:
    file: ../secrets/credentials.txt

networks:
  inception:
    driver: bridge

